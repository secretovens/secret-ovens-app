plugins { id 'com.android.application' }
android {
    namespace 'com.secretovens.samanlist'
    compileSdk 34
    defaultConfig {
        applicationId "com.secretovens.samanlist"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "10.0"
    }
    signingConfigs {
        debug {
            storeFile file('secretovens.keystore')
            storePassword 'secretovens'
            keyAlias 'secretovens'
            keyPassword 'secretovens'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
